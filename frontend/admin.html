<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="topbar inner-header">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">SS</span>
          <span>Admin Dashboard</span>
        </div>
        <button id="adminLogoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <main class="page-shell">
      <div class="container">
        <section class="stats-grid admin-stats">
          <div class="stat-card"><span class="stat-label">Total Students</span><strong id="totalStudents">0</strong></div>
          <div class="stat-card"><span class="stat-label">Total Requests</span><strong id="totalRequests">0</strong></div>
          <div class="stat-card"><span class="stat-label">Pending</span><strong id="pendingRequests">0</strong></div>
          <div class="stat-card"><span class="stat-label">Approved</span><strong id="approvedRequests">0</strong></div>
          <div class="stat-card"><span class="stat-label">Rejected</span><strong id="rejectedRequests">0</strong></div>
          <div class="stat-card"><span class="stat-label">Resolved Complaints</span><strong id="resolvedComplaints">0</strong></div>
        </section>

        <section class="card admin-section">
          <h3>Students</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Register Number</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Year</th>
                  <th>Semester</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card admin-section">
          <h3>Manage Requests</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Request ID</th>
                  <th>Student</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Submitted</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="adminRequestsTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/demo.js"></script>
  </body>
</html>
