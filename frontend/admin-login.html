<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Access | Smart Student Service Portal</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-panel auth-panel-form">
        <span class="auth-panel-kicker">AUTHORIZED ACCESS</span>
        <h2>Permanent Super Admin Login</h2>
        <p class="muted">Secure sign-in for the portal owner.</p>

        <form id="adminLoginForm" class="auth-form">
          <div class="field-wrap">
            <label for="admin-email">Email</label>
            <input id="admin-email" type="email" name="email" placeholder="Enter owner email" autocomplete="username" required />
          </div>

          <div class="field-wrap">
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Sign in as Super Admin</button>
        </form>

        <section class="demo-access-card" data-demo-panel aria-labelledby="demo-access-title">
          <div class="demo-access-heading"><div><span class="auth-panel-kicker">RECRUITER / REVIEW ACCESS</span><h3 id="demo-access-title">Admin Demo Login</h3></div><span class="demo-label">DEMO MODE</span></div>
          <p class="demo-access-status" data-demo-status role="status" aria-live="polite">Checking demo access…</p>
          <div class="demo-account-list">
            <article class="demo-account">
              <div><strong>Sample administrator</strong><span>Email <code data-demo-email="admin">Checking…</code></span><span>Access <code>Sample records only</code></span></div>
              <button class="btn btn-secondary" type="button" data-demo-role="admin">Login as Admin Demo</button>
            </article>
          </div>
        </section>

        <p class="auth-link"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/demo.js"></script>
  </body>
</html>
