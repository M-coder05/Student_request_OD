<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-panel auth-panel-form">
        <h2>Admin Login</h2>
        <p class="muted">Authorized access only.</p>

        <form id="adminLoginForm" class="auth-form">
          <div class="field-wrap">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter admin email" required />
          </div>

          <div class="field-wrap">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Admin Login</button>
        </form>

        <section class="demo-access-card" data-demo-panel aria-labelledby="demo-access-title">
          <div class="demo-access-heading"><div><span class="auth-panel-kicker">GUIDED ACCESS</span><h3 id="demo-access-title">Try a demo account</h3></div><span class="demo-label">DEMO</span></div>
          <p class="demo-access-status" data-demo-status role="status" aria-live="polite">Checking demo access…</p>
          <div class="demo-account-list">
            <article class="demo-account">
              <div><strong>Student demo</strong><span>Email <code data-demo-email="student">Checking…</code></span><span>Password <code data-demo-password="student">Checking…</code></span></div>
              <button class="btn btn-secondary" type="button" data-demo-role="student">Login as Student Demo</button>
            </article>
            <article class="demo-account">
              <div><strong>Admin demo</strong><span>Email <code data-demo-email="admin">Checking…</code></span><span>Password <code data-demo-password="admin">Checking…</code></span></div>
              <button class="btn btn-secondary" type="button" data-demo-role="admin">Login as Admin Demo</button>
            </article>
          </div>
        </section>

        <p class="auth-link"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/demo.js"></script>
  </body>
</html>
