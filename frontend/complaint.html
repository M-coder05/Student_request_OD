<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="page-body">
    <div class="container form-page">
      <div class="page-head">
        <h2>Submit Complaint</h2>
        <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
      </div>

      <form id="complaintForm" class="card form-card">
        <div class="two-col">
          <div class="field-wrap">
            <label>Student Name</label>
            <input type="text" name="studentName" readonly required />
          </div>
          <div class="field-wrap">
            <label>Register Number</label>
            <input type="text" name="registerNumber" readonly required />
          </div>
        </div>

        <div class="two-col">
          <div class="field-wrap">
            <label>Department</label>
            <input type="text" name="department" readonly required />
          </div>
          <div class="field-wrap">
            <label>Category</label>
            <select name="category" required>
              <option value="">Select category</option>
              <option value="Classroom">Classroom</option>
              <option value="Transport">Transport</option>
              <option value="Hostel">Hostel</option>
              <option value="Library">Library</option>
              <option value="Laboratory">Laboratory</option>
              <option value="Canteen">Canteen</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <div class="field-wrap">
          <label>Subject</label>
          <input type="text" name="subject" placeholder="Complaint subject" required />
        </div>

        <div class="field-wrap">
          <label>Description</label>
          <textarea name="description" rows="5" placeholder="Describe the issue in detail" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Complaint</button>
      </form>
    </div>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/complaint.js"></script>
    <script src="../js/demo.js"></script>
  </body>
</html>
