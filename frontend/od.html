<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OD Request</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="page-body">
    <div class="container form-page">
      <div class="page-head">
        <h2>On Duty Application</h2>
        <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
      </div>

      <form id="odForm" class="card form-card">
        <div class="two-col">
          <div class="field-wrap">
            <label>Student Name</label>
            <input type="text" name="studentName" readonly required />
          </div>
          <div class="field-wrap">
            <label>Register Number</label>
            <input type="text" name="registerNumber" readonly required />
          </div>
        </div>

        <div class="two-col">
          <div class="field-wrap">
            <label>Department</label>
            <input type="text" name="department" readonly required />
          </div>
          <div class="field-wrap">
            <label>Event Name</label>
            <input type="text" name="eventName" required />
          </div>
        </div>

        <div class="two-col">
          <div class="field-wrap">
            <label>Event Date</label>
            <input type="date" name="eventDate" required />
          </div>
          <div class="field-wrap">
            <label>Event Location</label>
            <input type="text" name="eventLocation" required />
          </div>
        </div>

        <div class="two-col">
          <div class="field-wrap">
            <label>Organizer</label>
            <input type="text" name="organizer" required />
          </div>
          <div class="field-wrap">
            <label>Reason</label>
            <input type="text" name="reason" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit OD Request</button>
      </form>
    </div>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/od.js"></script>
    <script src="../js/demo.js"></script>
  </body>
</html>
